<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="welcome.html" method="get">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" style="margin-bottom: 20px;">
        <br>
        <label for="address">Address</label>
        <input type="text" name="address" id="address" style="margin-bottom: 20px;">
        <br>
        <label for="email">Email</label>
        <input type="text" name="email" id="email" style="margin-bottom: 20px;">
        <br>
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>
        <br>
        <label for="mobile">Mobile</label>
        <input type="text" name="mobile" id="mobile" style="margin-bottom: 20px;">
        <br>
        <button type="submit" style="color: red;">Submit</button>
    </form>
</body>

</html>
