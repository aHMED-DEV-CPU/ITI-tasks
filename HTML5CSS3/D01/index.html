<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="innerContainer">
            <video src="video/frozen.mp4" width="600" poster="image/frozen.jpg" id="video"></video>
            <div class="progress">
                <input type="range" id="progress" min="0" max="100" value="0">
                <label for="progress"><span id="currentTime"></span> / <span id="TotalTime"></span></label>
            </div>
            <div class="controllers">
                <button id="play">Play</button>
                <button id="stop">stop</button>
                <div class="skipping">
                    <button>&lt;&lt;</button>
                    <button>&lt;</button>
                    <button>&gt;</button>
                    <button>&gt;&gt;</button>
                    <input type="range" min="0" max="100" value="50" id="volume">
                    <label for="volume" id="volText">50%</label>
                    <button id="mute">Mute</button>
                </div>

            </div>
            <input type="range" min="1" max="5" step="1" value="1" id="speed">
            <label for="speed">speed <span id="speedTxt">1</span>X</label>
        </div>

    </div>

    </div>


    <script src="index.js"></script>
</body>

</html>
