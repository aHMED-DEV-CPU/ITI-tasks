<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>jQuery Lab 1</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div id="menu">
    <button id="aboutButton">About</button>
    <button id="galleryButton">Gallery</button>
    <button id="servicesButton">Services</button>
    <button id="complainButton">Complain</button>
  </div>


  <div id="aboutSection" class="section">
    <h3>About</h3>
    <p>Story About snowman</p>
  </div>


  <div id="gallerySection" class="section">

    <h3>Gallery</h3>

    <div class="gallery-container">

      <img id="leftArrow" src="images/left.png" class="arrow">

      <img id="mainImage" src="images/1.jpg">

      <img id="rightArrow" src="images/right.png" class="arrow">

    </div>

  </div>


  <div id="servicesSection" class="section">

    <h3>Services</h3>

    <ul>
      <li>Service One</li>
      <li>Service Two</li>
      <li>Service Three</li>
    </ul>

  </div>


  <div id="complainSection" class="section">

    <div id="formContainer">

      <h3>Complain Form</h3>

      <input id="compName" placeholder="Name">
      <input id="compEmail" placeholder="Email">
      <input id="compPhone" placeholder="Phone">

      <textarea id="compText" placeholder="Complaint"></textarea>

      <br>

      <button id="sendBtn">Send</button>

    </div>


    <div id="previewArea">

      <h3>Preview</h3>

      <div id="previewContent"></div>

      <button id="editBtn">Edit</button>

    </div>

  </div>


  <script src="index.js"></script>

</body>

</html>
